sensors:
  c30d:
    interface: serial
    port: /dev/c30d
    baudrate: 115200
    timeout_s: 0.1

  imu:
    model: C30D onboard IMU
    interface: c30d
    source: c30d_feedback

  lidar:
    model: RPLIDAR C1
    interface: usb_serial
    port: /dev/rplidar
    baudrate: 460800

  camera:
    model: OAK-D Lite
    interface: usb
    fps: 30
    resolution: 720p
